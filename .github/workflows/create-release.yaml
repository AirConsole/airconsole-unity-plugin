name: Create Release

# Publishes v{Settings.VERSION} when a version bump lands on master: GitHub release with the
# committed Builds/*.unitypackage and CHANGELOG notes, plus a Release Log sheet row.
# Local dry run of the same steps: scripts/release.py --dry-run
on:
  push:
    branches: [master]
    paths: [Assets/AirConsole/scripts/Runtime/Settings.cs]
  workflow_dispatch:

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release (dry run)
        run: python3 scripts/release.py --dry-run

      - name: Auth to Google Sheets
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.RELEASE_LOG_SA_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/release.py
